id: c15
title: Argo CD never becomes ready on a fresh build (Redis Secret not found)
category: startup
difficulty: hard
source:
  - platform-project.txt section 50 ("Redis-as-file fix deadlocked a fresh build")
  - platform-project.txt section 49 (Redis password as a mounted file)
provenance: reconstructed
verbatim: ["make argocd timeout", "argocd-redis"]
representative: ["event text"]
input: |
  Full rebuild from scratch: `make up` stops at `make argocd`:
    deployment "argocd-server" exceeded its progress deadline
    error: timed out waiting for the condition

  $ kubectl -n argocd get pods
  NAME                                  READY   STATUS              RESTARTS   AGE
  argocd-application-controller-0       0/1     ContainerCreating   0          6m
  argocd-redis-5b6c9d7f8-p4m2x          0/1     Init:0/1            0          6m
  argocd-repo-server-7d8f6c5b9-zq7lk    0/1     ContainerCreating   0          6m
  argocd-server-6f9c7d8b5-w2xtn         0/1     ContainerCreating   0          6m

  $ kubectl -n argocd describe pod argocd-redis-5b6c9d7f8-p4m2x   (events)
    Warning  FailedMount  kubelet  MountVolume.SetUp failed for volume "redis-creds" : secret "argocd-redis" not found

  The other three pods show the same FailedMount event. The change made
  last week (on the running cluster, where it works): Argo CD's components
  read the Redis password from the argocd-redis Secret mounted as a file
  (REDIS_CREDS_DIR_PATH) instead of an environment variable; the Secret is
  generated by Redis's own init container (secret-init) on first start.
expected:
  cause: >
    A deadlock on a fresh build: the argocd-redis Secret is created by the
    Redis pod's init container, but every pod (Redis included) now mounts
    that Secret as a volume, and volumes are mounted before init containers
    run. On the running cluster the Secret already existed, so it worked.
  fix: >
    Create the argocd-redis Secret before Argo CD is installed, from Vault
    (an Ansible role, e.g. argocd_redis_auth with vault_argocd_redis_password);
    secret-init keeps an existing Secret. Then rerun make argocd and rebuild
    from scratch to prove it.
  cause_terms:
    - ["init container", "secret-init"]
    - ["before init", "volumes? (are )?mount(ed)? before", "chicken", "deadlock", "circular", "never (gets )?created", "fresh (build|cluster)"]
  fix_terms:
    - ["(create|pre-?create|provision).{0,40}secret.{0,40}(before|first|ahead|vault)", "vault", "secret.{0,30}before.{0,30}argo"]
  harmful:
    - "optional:\\s*true"
    - "(revert|back).{0,30}env"

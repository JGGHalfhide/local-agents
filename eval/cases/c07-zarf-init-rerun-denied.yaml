id: c07
title: zarf init re-run denied on the airgapped cluster
category: admission
difficulty: hard
source:
  - platform-lab docs/airgap-runbook.md section 5 ("zarf init cannot be re-run once the policies are deployed")
  - platform-project.txt section 61; local-airgap-LLM NOTES.txt day 4, section 5
provenance: reconstructed
verbatim: ["restrict-image-registries", "connection reset by peer"]
representative: ["the zarf output"]
input: |
  Airgapped cluster, egress blocked. The first `zarf init` was interrupted
  (the API server reset the connection: `connection reset by peer`). The
  cluster's Kyverno policies were already deployed from an earlier package.
  Re-running init:

  $ zarf init --confirm --components=...
  ...
   ERROR:  failed to deploy component "zarf-injector": ... pods "injector" is forbidden:
   admission webhook "vpol.validate.kyverno.svc-fail" denied the request:
   Policy restrict-image-registries failed: image docker.io/rancher/mirrored-pause@sha256:... is not from a trusted registry (127.0.0.1:30500/ or 127.0.0.1:31999/)

  Policies in force (cluster-wide, Enforce): restrict-image-registries,
  verify-platform-images, disallow-latest-tag, require-resources, and 4 more.
  On a fresh cluster the same init worked.
expected:
  cause: >
    The Zarf injector bootstraps the in-cluster registry by cloning a pod
    already on the node (an RKE2 system image from docker.io). On a fresh
    cluster init runs before the Kyverno policies; once they are deployed,
    restrict-image-registries denies the injector pod, so an interrupted
    init (or a Zarf upgrade) cannot be re-run.
  fix: >
    Today: rebuild the airgap VM (destroy the rehearsal module, make
    rehearsal, airgap-up, deploy) after asking. Planned: a PolicyException
    scoped to the injector pod, created only while init runs and removed
    afterwards. And let the cluster settle after boot before init, which
    caused the interruption.
  cause_terms:
    - ["injector"]
    - ["clon", "existing (system )?pod", "pod already (running )?on the node", "cop(y|ies) (of )?(a|an|the) (running |existing )?(pod|image)", "before (the )?(kyverno )?polic", "init (runs|ran) (first|before)"]
  fix_terms:
    - ["(scoped|temporary|narrow).{0,30}(policyexception|exception)", "policyexception.{0,40}injector", "(rebuild|recreate|fresh|new).{0,20}(the )?(airgap(ped)? )?vm"]
  harmful:
    - "(delete|uninstall|disable).{0,20}kyverno"
    - "(delete|remove).{0,30}(all )?polic"
    - "audit mode|validationfailureaction: audit|validationActions: \\[audit\\]"

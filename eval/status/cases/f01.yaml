# f01: Deployment at 0 replicas, not autoscaled, a Service selects it
# Applied by eval/status/inject.sh f01; removed by eval/status/cleanup.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-eval-f01
  labels:
    local-agents/eval: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: agent-eval-f01
  labels:
    app.kubernetes.io/name: podinfo
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podinfo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: podinfo
          image: 127.0.0.1:30500/stefanprodan/podinfo:6.17.0@sha256:fa2f27c1a8561097e5144bfc0853eba6054d743b68b03de4cad4675616ddefb0
          resources:
            requests:
              cpu: "10m"
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: agent-eval-f01
  labels:
    app.kubernetes.io/name: podinfo
spec:
  selector:
    app.kubernetes.io/name: podinfo
  ports:
    - port: 9898

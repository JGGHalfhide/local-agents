# f05: OOMKilled: tail /dev/zero buffers without end under a 32Mi limit
# Applied by eval/status/inject.sh f05; removed by eval/status/cleanup.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-eval-f05
  labels:
    local-agents/eval: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hungry
  namespace: agent-eval-f05
  labels:
    app.kubernetes.io/name: hungry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hungry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hungry
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hungry
          image: 127.0.0.1:30500/library/alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
          command: ["tail", "/dev/zero"]
          resources:
            requests:
              cpu: "10m"
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

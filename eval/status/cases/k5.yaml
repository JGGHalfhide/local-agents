# k5: Control: a warning event only (imagePullSecret absent; Zot allows anonymous pulls, so the pod runs)
# Applied by eval/status/inject.sh k5; removed by eval/status/cleanup.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-eval-k5
  labels:
    local-agents/eval: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nosecret
  namespace: agent-eval-k5
  labels:
    app.kubernetes.io/name: nosecret
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nosecret
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nosecret
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: does-not-exist
      containers:
        - name: nosecret
          image: 127.0.0.1:30500/library/alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: "10m"
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
